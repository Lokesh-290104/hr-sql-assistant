<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Query Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Cpath d='M9 22V10h3v5h8v-5h3v12h-3v-4.5h-8V22z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">HR Query Assistant</div>
    <label class="field">
      <span>View data as</span>
      <select id="role">
        <option value="hr_admin">HR Admin (all data)</option>
        <option value="manager">Manager (no salary data)</option>
      </select>
    </label>
    <div class="section-title">Tables you can query</div>
    <div id="schema" class="schema"></div>
    <a class="api-link" href="/docs" target="_blank" rel="noopener">REST API docs &rarr;</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSidebar" aria-label="Show tables" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
      <h1>Ask about your people data</h1>
      <button class="text-btn" id="newChat">New chat</button>
    </header>

    <section class="chat" id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2 class="welcome-title">What would you like to know?</h2>
        <p>Ask in plain English. You'll see the answer and the read-only SQL behind it.</p>
        <div class="chips" id="examples"></div>
      </div>
    </section>

    <form class="composer" id="composer">
      <input id="question" autocomplete="off" maxlength="500"
             placeholder="e.g. How many people joined Engineering this year?" aria-label="Your question">
      <button type="submit" id="send">Ask</button>
    </form>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
